<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Quy trình & Hướng dẫn Khám - CareRoute CSYT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Be Vietnam Pro"', 'Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#e8f5e9',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex bg-[#f8fafc] text-slate-800 antialiased">

  <!-- Sidebar -->
  <aside id="appSidebar" class="w-72 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 transition-transform lg:translate-x-0 -translate-x-full fixed lg:static top-0 bottom-0 z-40">
    <div>
      <div class="p-6 border-b border-slate-100 flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-teal-50 border border-teal-100 text-teal-600 flex items-center justify-center shrink-0 shadow-xs">
          <i data-lucide="cross" class="w-6 h-6 stroke-[2.5]"></i>
        </div>
        <div class="overflow-hidden">
          <h2 class="font-bold text-sm text-slate-900 truncate">Bệnh viện Đa khoa Tâm Anh</h2>
          <p class="text-xs text-slate-400 font-medium">Quản trị viên CSYT</p>
        </div>
      </div>

      <nav class="p-4 space-y-1.5">
        <a href="facility-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all">
          <i data-lucide="layout-grid" class="w-5 h-5 text-slate-400"></i>
          <span>Bảng điều khiển</span>
        </a>
        <a href="facility-service-management.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-slate-400"></i>
          <span>Quản lý Dịch vụ</span>
        </a>
        <a href="facility-guidance-management.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold text-teal-800 bg-[#e8f5e9] transition-all">
          <i data-lucide="map" class="w-5 h-5 text-teal-700"></i>
          <span>Quy trình hướng dẫn</span>
        </a>
        <a href="reviewer-feedback-review.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all">
          <i data-lucide="message-square" class="w-5 h-5 text-slate-400"></i>
          <span>Phản hồi & Đánh giá</span>
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-100">
      <a href="../index.html" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Về Cổng thông tin chung
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-xl">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div>
          <h1 class="text-xl font-bold text-slate-900">Quy trình Hướng dẫn Khám Bệnh</h1>
          <p class="text-xs text-slate-500">Thiết lập các bước chỉ dẫn đón tiếp bệnh nhân rõ ràng, trực quan</p>
        </div>
      </div>

      <button onclick="openCreateGuidanceModal()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-teal-600/20 transition-all">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Tạo Quy trình Mới</span>
      </button>
    </header>

    <main class="p-6 lg:p-8 max-w-7xl mx-auto w-full space-y-6">
      
      <!-- List of Guidances -->
      <div id="guidanceListContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Rendered via JS -->
      </div>

    </main>
  </div>

  <!-- Guidance Modal (Add / Edit) -->
  <div id="guidanceModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-slide-in">
      <div class="p-6 border-b border-slate-100 flex items-center justify-between">
        <h3 id="guidanceModalTitle" class="font-bold text-lg text-slate-900">Tạo Quy trình Khám Mới</h3>
        <button onclick="closeModal('guidanceModal')" class="p-2 text-slate-400 hover:text-slate-700 rounded-xl">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="guidanceForm" onsubmit="handleSaveGuidance(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="guidanceId">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Tiêu đề Quy trình <span class="text-rose-500">*</span></label>
          <input type="text" id="guidanceTitle" required placeholder="VD: Quy trình Khám bệnh Ngoại trú có thẻ BHYT..." class="w-full px-4 py-2.5 text-sm bg-slate-50 focus:bg-white border border-slate-200 focus:border-teal-500 rounded-xl outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Phân loại / Chuyên mục</label>
            <input type="text" id="guidanceCategory" placeholder="VD: Khám BHYT, Cấp cứu, Dịch vụ..." class="w-full px-4 py-2.5 text-sm bg-slate-50 focus:bg-white border border-slate-200 focus:border-teal-500 rounded-xl outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Thời gian ước tính</label>
            <input type="text" id="guidanceEstTime" placeholder="VD: 60 - 90 phút" class="w-full px-4 py-2.5 text-sm bg-slate-50 focus:bg-white border border-slate-200 focus:border-teal-500 rounded-xl outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Đối tượng áp dụng</label>
          <input type="text" id="guidanceAudience" placeholder="VD: Bệnh nhân khám có BHYT và CCCD gắn chip..." class="w-full px-4 py-2.5 text-sm bg-slate-50 focus:bg-white border border-slate-200 focus:border-teal-500 rounded-xl outline-none">
        </div>

        <!-- Steps Builder -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-bold text-slate-700">Các bước thực hiện (Timeline Steps) <span class="text-rose-500">*</span></label>
            <button type="button" onclick="addNewStepField()" class="text-xs font-bold text-teal-600 hover:text-teal-700 flex items-center gap-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Thêm bước
            </button>
          </div>
          <div id="stepsContainer" class="space-y-3">
            <!-- Dynamic step rows -->
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal('guidanceModal')" class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Hủy</button>
          <button type="submit" class="px-5 py-2.5 text-sm font-semibold bg-teal-600 hover:bg-teal-700 text-white rounded-xl shadow-md shadow-teal-600/20">Lưu Quy Trình</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let currentSteps = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderGuidanceList();
    });

    function renderGuidanceList() {
      const guidances = CareRouteDB.getGuidances('fac-1');
      const container = document.getElementById('guidanceListContainer');

      if (guidances.length === 0) {
        container.innerHTML = `<div class="col-span-2 p-12 text-center bg-white rounded-2xl border border-slate-200">Chưa có quy trình nào. Hãy tạo quy trình mới!</div>`;
        return;
      }

      container.innerHTML = guidances.map(g => `
        <div class="bg-white rounded-2xl p-6 border border-slate-200/90 shadow-xs flex flex-col justify-between space-y-6">
          <div>
            <div class="flex items-center justify-between gap-3 mb-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-teal-50 text-teal-700 border border-teal-100">
                ${g.category || 'Quy trình chung'}
              </span>
              <span class="text-xs text-slate-400 flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${g.estimatedTime || 'N/A'}
              </span>
            </div>
            <h3 class="font-bold text-base text-slate-900">${g.title}</h3>
            <p class="text-xs text-slate-500 mt-1">Đối tượng: ${g.targetAudience || 'Mọi bệnh nhân'}</p>

            <!-- Steps preview timeline -->
            <div class="mt-5 space-y-3 pl-2 border-l-2 border-teal-100 ml-2">
              ${(g.steps || []).map(s => `
                <div class="relative pl-4">
                  <div class="absolute -left-[13px] top-1 w-2.5 h-2.5 rounded-full bg-teal-600 ring-4 ring-teal-50"></div>
                  <h5 class="text-xs font-bold text-slate-800">Bước ${s.step}: ${s.title}</h5>
                  <p class="text-xs text-slate-500 mt-0.5">${s.content}</p>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <span class="text-[11px] text-slate-400">Cập nhật: ${g.updatedAt || 'Hôm nay'}</span>
            <div class="space-x-1">
              <button onclick="editGuidance('${g.id}')" class="p-2 text-slate-400 hover:text-teal-600 rounded-lg hover:bg-teal-50" title="Chỉnh sửa">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteGuidance('${g.id}')" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50" title="Xóa">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    function openCreateGuidanceModal() {
      document.getElementById('guidanceForm').reset();
      document.getElementById('guidanceId').value = '';
      document.getElementById('guidanceModalTitle').innerText = 'Tạo Quy trình Khám Mới';
      currentSteps = [
        { step: 1, title: 'Tiếp đón & Đăng ký', content: 'Quét thẻ CCCD hoặc VNeID lấy số thứ tự tại sảnh tiếp đón.' },
        { step: 2, title: 'Khám chuyên khoa', content: 'Vào phòng khám nghe tư vấn và khám lâm sàng.' }
      ];
      renderStepFields();
      openModal('guidanceModal');
    }

    function editGuidance(id) {
      const g = CareRouteDB.getGuidances().find(x => x.id === id);
      if (!g) return;

      document.getElementById('guidanceId').value = g.id;
      document.getElementById('guidanceTitle').value = g.title;
      document.getElementById('guidanceCategory').value = g.category || '';
      document.getElementById('guidanceEstTime').value = g.estimatedTime || '';
      document.getElementById('guidanceAudience').value = g.targetAudience || '';
      document.getElementById('guidanceModalTitle').innerText = 'Chỉnh sửa Quy trình Khám';

      currentSteps = JSON.parse(JSON.stringify(g.steps || []));
      renderStepFields();
      openModal('guidanceModal');
    }

    function renderStepFields() {
      const container = document.getElementById('stepsContainer');
      container.innerHTML = currentSteps.map((s, idx) => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 relative group space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-teal-700">Bước ${idx + 1}</span>
            <button type="button" onclick="removeStepField(${idx})" class="text-slate-400 hover:text-rose-500">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <input type="text" placeholder="Tiêu đề bước..." value="${s.title || ''}" onchange="currentSteps[${idx}].title = this.value" class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none">
          <textarea rows="2" placeholder="Chi tiết hướng dẫn..." onchange="currentSteps[${idx}].content = this.value" class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none">${s.content || ''}</textarea>
        </div>
      `).join('');
      if (window.lucide) window.lucide.createIcons();
    }

    function addNewStepField() {
      currentSteps.push({ step: currentSteps.length + 1, title: '', content: '' });
      renderStepFields();
    }

    function removeStepField(idx) {
      currentSteps.splice(idx, 1);
      currentSteps.forEach((s, i) => s.step = i + 1);
      renderStepFields();
    }

    function handleSaveGuidance(e) {
      e.preventDefault();
      const id = document.getElementById('guidanceId').value;
      const data = {
        id: id || undefined,
        facilityId: 'fac-1',
        title: document.getElementById('guidanceTitle').value,
        category: document.getElementById('guidanceCategory').value,
        estimatedTime: document.getElementById('guidanceEstTime').value,
        targetAudience: document.getElementById('guidanceAudience').value,
        steps: currentSteps,
        status: 'published'
      };

      CareRouteDB.saveGuidance(data);
      closeModal('guidanceModal');
      renderGuidanceList();
      showToast('Đã lưu quy trình hướng dẫn thành công!', 'success');
    }

    function deleteGuidance(id) {
      if (confirm('Bạn có chắc chắn muốn xóa quy trình hướng dẫn này?')) {
        CareRouteDB.deleteGuidance(id);
        renderGuidanceList();
        showToast('Đã xóa quy trình.', 'info');
      }
    }
  </script>
</body>
</html>
